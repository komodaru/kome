# 不変条件の台帳。
#
# 一つの不変条件につき: 識別子、文、持ち主のモジュール、状態から数え直す検査 (audit)、
# 壊した状態を検査が検出することの試験 (caught)、守られていることの試験 (tests)、
# Kani の証明 (proofs)、TLA+ の性質 (models、「モジュール:性質」)、範囲 (scope)。
#
# 証明があれば proved に、何を示したかと前提 (小さな上限、確保の成否) と、示していないことを書く。
# モデルがあれば、次の三つを分けて書く。
#   modelled: モデルが調べること (設計についての検査で、Rust のコードの検査ではない)
#   tied:     実装から生成した表がモデルと Rust を結ぶ範囲と、結ばれていない範囲
#   tested:   結ばれていない範囲を、実装のどの試験が見るか
#
# kome-lint の ledger 規則が、ここ・crates/kome/src/error.rs の Invariant・試験・証明・
# モデルが食い違わないことを確かめる。models に書けるのは、正しい設定で検査され、
# 誤りの変種 (tla/expect.tsv) で破れる性質だけである。

[[invariant]]
id = "RUN-1"
variant = "RunOnePermit"
statement = "一つのスレッドに有効な実行権は一つ。一つの worker が持つ実行権も一つ。"
owner = "crates/kome/src/sched.rs"
audit = "audit_runs"
caught = "crates/kome/src/tests.rs::audit_detects_two_permits_for_one_thread"
tests = [
    "crates/kome/src/tests.rs::a_permit_given_to_the_wrong_kernel_comes_back",
    "crates/kome/src/tests.rs::a_failure_after_acceptance_consumes_the_permit",
    "crates/kome/src/tests.rs::a_restored_state_refuses_a_permit_lent_by_the_original",
    "crates/kome/src/tests.rs::lending_without_room_in_the_table_changes_nothing",
    "crates/kome/src/tests.rs::a_restored_state_lends_the_thread_that_was_ready",
    "crates/kome/src/tests.rs::a_worker_holds_one_permit_and_a_thread_is_lent_once",
    "crates/kome/src/tests.rs::a_stale_or_foreign_permit_changes_nothing",
    "crates/kome/src/tests.rs::a_snapshot_is_restored_only_as_another_instance_with_nothing_lent",
    "crates/kome/src/tests.rs::each_stop_reason_decides_where_the_thread_goes",
    "crates/kome/src/tests.rs::a_stop_that_does_not_fit_the_run_is_refused_and_the_permit_comes_back",
    "crates/kome/src/tests.rs::a_named_grant_ignores_the_order_but_not_the_rules",
    "crates/kome/src/tests.rs::a_context_follows_its_thread_across_workers",
    "crates/kome/src/tests.rs::a_run_that_cannot_proceed_still_returns_its_permit",
    "crates/kome-testkit/tests/sim.rs::every_property_holds_for_any_operation_sequence",
    "crates/kome-testkit/tests/sim.rs::the_generator_reaches_every_scheduling_outcome",
]
proofs = [
    "a_stop_reason_is_accepted_only_when_it_fits",
]
models = []
proved = "止まった理由を受理するかどうか (stop_allowed) と、受理した後のスレッドの行き先 (after_stop) について、理由・中断の要求の有無・貸した量・実行した量・終了要求の全ての値。前提は無い。実行権の照合、貸し出しの記録、実行待ちの列の更新は示していない。その部分は試験と決定的シミュレーションが見る。"
scope = "実行権は複製できない値 (RunPermit) で、返却のときにインスタンスと実行の世代を照合する。Kernel も複製できず、写し (Snapshot) は実行権を貸していないときに別の実行インスタンスとしてだけ復元できる。worker が実行権を返さずに実行を続けないことは、実行統括 (kome の外) が守る。"

[[invariant]]
id = "RUN-2"
variant = "RunQueue"
statement = "実行待ちの列は、いま貸せるスレッドをちょうど一度ずつ含み、先頭が最も先に貸すスレッドである。"
owner = "crates/kome/src/runq.rs"
audit = "audit_runs"
caught = "crates/kome/src/tests.rs::audit_detects_a_runnable_thread_missing_from_the_queue"
tests = [
    "crates/kome/src/tests.rs::the_highest_priority_runs_first_and_equals_run_in_order",
    "crates/kome/src/tests.rs::threads_run_in_fifo_order_and_a_preempted_thread_goes_to_the_back",
    "crates/kome/src/tests.rs::suspension_combines_with_every_run_state",
    "crates/kome/src/tests.rs::the_run_queue_lends_in_the_same_order_as_a_scan_of_every_thread",
    "crates/kome/src/tests.rs::threads_held_back_by_old_runs_return_in_their_original_order",
    "crates/kome-testkit/tests/sim.rs::every_property_holds_for_any_operation_sequence",
]
proofs = ["the_lending_order_is_a_strict_total_order"]
proved = "貸す順序 (lent_before) について、三つの席の優先度と実行待ちになった順番の全ての値。どの二つにも順序が付き、回らない。前提は無い。列 (ヒープ) の出し入れで形が保たれること、各スレッドが持つ位置が席と合うことは示していない。"
models = []
scope = "貸せるとは、実行待ちで、停止の数が 0 で、プロセスに古い世代の実行が残っていないこと。貸す順序は、優先度が高い方、同じなら先に実行待ちになった方。列はこの順序のヒープで、各スレッドが列の中の自分の位置を持つ。Kani が示すのは順序が必ず付くことだけで、列の形が保たれることは audit と試験が見る。優先度をいつ変えるかは Personality が決める。"

[[invariant]]
