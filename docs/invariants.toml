    "crates/kome-testkit/tests/sim.rs::the_generator_reaches_every_fast_path_outcome",
]
proofs = [
    "a_tlb_entry_of_u32_hits_exactly_its_page",
    "a_tlb_entry_of_u64_hits_exactly_its_page",
]
models = []
proved = "一つの項目の照合について、頁の大きさ (2 の冪の全て)、アドレスと位置 (u64 の全ての値)、許可の全ての組。項目が埋めた頁にだけ、許した側でだけ当たり、位置が回り込まないことを示す。表の全体 (アドレス空間が変わった後に古い項目が残らないこと、コードの頁、書かれた頁) は示していない (決定的シミュレーションが見る)。"
scope = "表は Kernel の外にあり、audit は数え直さない。決定的シミュレーションが、操作のたびに全てのプロセスの全ての頁について、表に当たるアドレスを頁ごとの独立したモデルと比べる。アドレス空間の変更を表へ知らせること (通知つきの口を使う、復元の後に空にする) は Host の責任で、知らせなかった表は古い項目を持ち続ける。変換したコードが項目を読む命令列そのものは kome の外にある。"

[[invariant]]
id = "FX-1"
variant = "EffectsKept"
statement = "キューが満杯でも、受理済み操作の Effect を失わない (予約数が一致する)。"
owner = "crates/kome/src/effect.rs"
audit = "audit_effects"
caught = "crates/kome/src/tests.rs::audit_detects_a_lost_effect_promise"
tests = [
    "crates/kome/src/tests.rs::the_input_sequence_alone_decides_the_replies",
    "crates/kome/src/tests.rs::a_restored_empty_state_creates_and_exits_a_process",
    "crates/kome/src/tests.rs::a_restored_state_wakes_a_wait_and_reports_it",
    "crates/kome/src/tests.rs::a_full_effect_queue_refuses_before_accepting",
    "crates/kome-testkit/tests/headless.rs::shortage_is_reported_before_the_request_is_accepted",
    "crates/kome-testkit/tests/sim.rs::every_property_holds_for_any_operation_sequence",
]
proofs = [
    "io_promises_cover_every_emission",
    "seats_never_promise_beyond_the_limit",
    "seats_return_only_what_was_promised",
    "effects_emit_exactly_what_was_promised",
]
models = []
proved = "席の勘定 (Seats) は整数だけなので、上限・キューの数・予約の数の全ての値について示す。I/O の遷移が出す Effect が予約に収まることは、全ての状態と出来事について示す。勘定とキューの中身が食い違わないこと (effects_emit_exactly_what_was_promised) は小さな上限での証明。前提: 上限 2、記憶域の確保が成功した場合、予約 2 以下。それより大きい上限では示していない (試験が見る)。"
scope = "操作は、将来出しうる Effect の席を受理の時点で予約する。席が無ければ受理の前に不足を返す。"

[[invariant]]
id = "OBJ-1"
variant = "ObjectRefs"
