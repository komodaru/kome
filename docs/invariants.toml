owner = "crates/kome/src/id.rs"
audit = "audit_ids"
caught = "crates/kome/src/tests.rs::audit_detects_a_corrupt_free_list"
tests = [
    "crates/kome/src/tests.rs::a_resource_id_from_another_kernel_is_foreign",
    "crates/kome/src/tests.rs::a_foreign_id_is_refused_in_every_position",
    "crates/kome/src/tests.rs::a_restored_state_keeps_the_ids_issued_before_the_snapshot_only",
    "crates/kome/src/id.rs::stale_id_resolves_nothing_after_reuse",
    "crates/kome-testkit/tests/sim.rs::every_property_holds_for_any_operation_sequence",
]
proofs = [
    "a_removed_id_never_resolves_again",
    "an_exhausted_slot_is_retired",
    "an_id_from_another_issuer_never_resolves",
]
models = []
proved = "表を使う小さな上限での証明。前提: 表の上限は 1、記憶域の確保が成功した場合、作成・削除・再作成が 1 回ずつ。その中で、最初の世代と実行インスタンスの識別は全ての値。複数のスロットを持つ表と長い操作の列は示していない (試験と決定的シミュレーションが見る)。"
scope = "スロットごとの世代と発行元で見分ける。世代を使い切ったスロットは二度と使わない。復元した状態は、写しの時点までの ID を引き継ぐ。実行インスタンスの識別が一意であることは実行統括 (kome の外) が守る。ゲストに見せるハンドルの番号は Personality が持ち、ここには含まない。"

[[invariant]]
id = "IO-1"
variant = "IoOnce"
statement = "終端済みの I/O は再度終端しない。"
owner = "crates/kome/src/io.rs"
audit = "audit_ios"
caught = "crates/kome/src/tests.rs::audit_detects_an_io_pointing_at_nothing"
tests = [
    "crates/kome/src/tests.rs::a_second_or_late_or_foreign_completion_changes_nothing",
    "crates/kome/src/tests.rs::cancel_is_a_request_and_the_host_decides_the_outcome",
    "crates/kome-testkit/tests/headless.rs::duplicate_and_late_completions_are_refused",
    "crates/kome-testkit/tests/sim.rs::every_property_holds_for_any_operation_sequence",
]
proofs = [
    "io_outcome_is_settled_once",
]
models = [
    "IoLifecycle:SettlesOnce",
    "IoLifecycle:NoWakeBeforeOutput",
    "IoLifecycle:NoReleaseInFlight",
]
proved = "io_step の一歩について、全ての状態・出来事・結果の値。前提は無い。出来事の列についての性質は、一歩の性質の繰り返しとして成り立つ。Kernel が io_step の周りで行う通知・固定・Effect の発行は示していない。"
modelled = "IoLifecycle は一つの要求について、ホストが完了を重複して送る場合と取消の後に完了が届く場合を含む全ての順序を調べる。調べるのは設計であり、Rust のコードではない。要求は一つで、探索は有限。"
tied = "受理する遷移の表 IoTable は io.rs の io_step から生成し、試験 the_tla_table_is_io_step が実装との一致を確かめる。待機を起こす時点と解放の時点を含む状態と遷移の全体は、scripts/ci/tla.sh が TLC の状態グラフと実際の Kernel の動きを突き合わせて、過不足なく一致することを確かめる (crates/kome/src/conform.rs、docs/tla-conformance.md)。"
tested = "待機を起こすのが公開の後であること、進行中に解放しないことが実装で成り立つことは、tests の試験と決定的シミュレーションが見る。複数の要求が混ざる場合も同じ。"
scope = "一つの要求の進行。ホストが完了を重複して送ること、取消の後に正常完了が届くことを含む。転送の内容とバッファは Personality と Host が持つ。"

[[invariant]]
id = "IPC-1"
variant = "ChannelKept"
statement = "通信路の中身は容量に収まり、端の保持数・運ばれている資源の保持・読める書けるの通知は中身と一致する。"
owner = "crates/kome/src/ipc.rs"
audit = "audit_channels"
caught = "crates/kome/src/tests.rs::audit_detects_a_channel_out_of_step"
tests = [
    "crates/kome/src/tests.rs::messages_keep_their_boundaries_and_order",
    "crates/kome/src/tests.rs::a_stream_takes_what_fits_and_has_no_boundaries",
    "crates/kome/src/tests.rs::readers_and_writers_wait_on_the_channel",
    "crates/kome/src/tests.rs::a_closed_end_is_seen_by_the_other_side",
    "crates/kome/src/tests.rs::a_channel_without_receivers_drops_its_content",
    "crates/kome/src/tests.rs::a_message_carries_a_hold_from_sender_to_receiver",
    "crates/kome/src/tests.rs::a_carried_backing_is_released_when_nobody_can_receive_it",
    "crates/kome/src/tests.rs::process_exit_closes_its_ends",
    "crates/kome/src/tests.rs::channels_are_bounded_by_the_limits",
    "crates/kome/src/tests.rs::a_restored_state_carries_the_channel_content",
    "crates/kome-testkit/tests/sim.rs::every_property_holds_for_any_operation_sequence",
    "crates/kome-testkit/tests/sim.rs::the_generator_reaches_every_channel_outcome",
]
proofs = [
    "an_admitted_send_fits_the_channel",
]
models = []
proved = "送信を受け付けるかどうかの判定 (ChannelSpec::admit) について、形・長さ・中身の量の全ての値。前提: 前の状態は audit が確かめる範囲にある。示すのは、メッセージを受け付けるのは長さが上限以下で数が上限より少ないときだけであること、流れは受け付けた後も容量に収まること、受け付けないのは空きが無いときだけであること。メッセージの列の中身が容量 (数 × 長さの上限) に収まることは、この二つから従うが、掛け算は証明の中で計算していない。バイト列の出し入れ、端の保持、通知、資源の受け渡しは示していない。その部分は試験と、独立したモデルと比べる決定的シミュレーションが見る。"
scope = "一つの Kernel の中の通信路。送信と受信はスレッドを止めない (待つのは通知の資源への wait)。名前、接続、メッセージの書式は Personality が持つ。"

[[invariant]]
id = "WAIT-1"
variant = "WaitOnce"
statement = "待機結果は一つだけ確定する (待機の登録は対象・期限と一対一に対応する)。"
owner = "crates/kome/src/wait.rs"
audit = "audit_waits"
caught = "crates/kome/src/tests.rs::audit_detects_a_wait_resolved_twice"
tests = [
    "crates/kome/src/tests.rs::a_wait_times_out_exactly_once_at_its_deadline",
    "crates/kome/src/tests.rs::terminating_a_blocked_thread_removes_its_wait",
    "crates/kome/src/tests.rs::wait_all_takes_everything_at_once_or_nothing",
    "crates/kome-testkit/tests/sim.rs::every_property_holds_for_any_operation_sequence",
]
proofs = []
models = [
    "WaitRace:OneOutcome",
    "WaitRace:AllOrNothing",
]
modelled = "WaitRace は 3 スレッド・2 資源・資源ごとの通知 2 回までの全ての順序で、待機の開始・通知・登録順の評価・期限の競合を調べる。調べるのは設計であり、Rust のコードではない。"
tied = "成立の判定と消費の表 WaitTable は Kernel::wait を実際に動かして生成し、試験 the_tla_wait_table_is_the_kernel が一致を確かめる。待機の列の扱い (登録順の評価、期限) を含む状態と遷移の全体は、scripts/ci/tla.sh が TLC の状態グラフと実際の Kernel の動きを突き合わせて、過不足なく一致することを確かめる (crates/kome/src/conform.rs、docs/tla-conformance.md)。中断はモデルに無い。"
tested = "結果が一度だけ確定すること、「すべて」が一括で消費することが実装で成り立つことは、audit の数え直し、tests の試験、決定的シミュレーションが見る。中断とスレッドの終了による確定はモデルに無く、試験だけが見る。"
scope = "成立・期限・中断・スレッドの終了のどれか一つで終わる。「すべて」は全対象が同時に成立したときにだけ、まとめて消費する。"

[[invariant]]
id = "WAIT-2"
variant = "WaitNoLostWake"
statement = "成立している待機が登録されたまま残らない (起床を失わない)。"
owner = "crates/kome/src/wait.rs"
audit = "audit_waits"
caught = "crates/kome/src/tests.rs::audit_detects_a_lost_wakeup"
tests = [
    "crates/kome/src/tests.rs::a_satisfied_wait_does_not_register",
    "crates/kome/src/tests.rs::waiters_are_woken_in_registration_order",
    "crates/kome-testkit/tests/sim.rs::every_property_holds_for_any_operation_sequence",
]
proofs = []
models = [
    "WaitRace:NoLostWake",
]
modelled = "WaitRace は 3 スレッド・2 資源・資源ごとの通知 2 回までの全ての順序で、確認と登録が一つの状態更新であれば成立した待機が待ち続けないことを調べる。確認と登録を分けた変種では反例が出る。"
tied = "成立の判定と消費の表 WaitTable は Kernel::wait を実際に動かして生成する。確認と登録が一つの更新であることは、実装では Kernel を &mut で一つずつ更新する型の制約から来る。モデルの状態と遷移の全体は、scripts/ci/tla.sh が TLC の状態グラフと実際の Kernel の動きを突き合わせて、過不足なく一致することを確かめる (crates/kome/src/conform.rs、docs/tla-conformance.md)。"
tested = "同じ資源を待つ待機を登録順に評価することが実装で成り立つことは、tests の試験と決定的シミュレーションが見る。"
scope = "確認と登録は一つの状態更新で行う。同じ資源を待つ待機は登録順に評価する。"

