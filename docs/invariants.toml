]
proofs = []
models = []
scope = "保持はプロセスごとに数え、固定は待機・タイマ・I/O・終了通知が持つ。名前空間と継承は Personality が上に作る。"

[[invariant]]
id = "TIME-1"
variant = "TimeOrder"
statement = "期限の列は (時刻, 登録順) の順で、待機・タイマと一対一に対応する。"
owner = "crates/kome/src/timer.rs"
audit = "audit_time"
caught = "crates/kome/src/tests.rs::audit_detects_an_unordered_deadline_list"
tests = [
    "crates/kome/src/tests.rs::same_instant_deadlines_fire_in_registration_order",
    "crates/kome/src/tests.rs::periodic_timer_refires_and_stops_when_disarmed",
    "crates/kome/src/tests.rs::a_period_that_leaves_the_time_range_stops_the_timer",
    "crates/kome/src/tests.rs::the_shortest_period_still_lets_time_advance",
    "crates/kome/src/tests.rs::a_long_jump_returns_after_a_bounded_amount_of_work",
    "crates/kome/src/tests.rs::splitting_an_advance_changes_no_outcome",
    "crates/kome/src/tests.rs::deadlines_of_one_instant_are_never_split",
    "crates/kome/src/tests.rs::catching_up_a_timer_set_in_the_past_is_split_too",
    "crates/kome-testkit/tests/sim.rs::every_property_holds_for_any_operation_sequence",
]
proofs = [
    "instant_add_never_wraps",
    "a_period_moves_the_deadline_forward",
]
models = []
proved = "時刻の加算と周期の加算について、u64 の全ての値。前提は無い。期限の列の順序と advance の処理は示していない (audit の数え直し、試験、決定的シミュレーションが見る)。"
scope = "時刻は外から与える仮想時刻で、戻らない。実時間との対応は Host が持つ。周期と周期の下限は 0 を表せない型 (Period) で、周期タイマの次の期限は必ず後になる。一度の advance が処理する期限の数には目安 (Limits::advance_batch) があり、残りがあれば区切って返る。区切っても、起床の順序・結果・通知の数は変わらない。"

[[invariant]]
id = "PROC-1"
variant = "ProcessTree"
statement = "プロセスとスレッドの所属関係は相互に一致し、終了済みのプロセスは資源を持たない。"
owner = "crates/kome/src/process.rs"
audit = "audit_processes"
caught = "crates/kome/src/tests.rs::audit_detects_a_thread_outside_its_process"
tests = [
    "crates/kome/src/tests.rs::process_is_created_run_exited_and_reclaimed",
    "crates/kome/src/tests.rs::exit_process_waits_for_running_threads_to_stop",
    "crates/kome/src/tests.rs::process_exit_drains_in_flight_io_before_reclaim",
    "crates/kome/src/tests.rs::the_tla_exit_table_is_the_kernel",
    "crates/kome-testkit/tests/headless.rs::process_exit_during_a_read_drains_before_reclaim",
    "crates/kome-testkit/tests/sim.rs::every_property_holds_for_any_operation_sequence",
]
proofs = []
models = [
    "ProcessExit:NoExitWhileRunning",
    "ProcessExit:NoGrantAfterExit",
    "ProcessExit:ReleasedAtExit",
    "ProcessExit:ExitsOnce",
    "ProcessExit:NoReclaimInFlight",
    "ProcessExit:KilledAreInterrupted",
]
modelled = "ProcessExit は 3 スレッドと一つの I/O について、終了の要求・実行権の返却・完了の全ての順序を調べる。調べるのは設計であり、Rust のコードではない。"
tied = "スレッドごとの終了の表 ExitTable (ExitThread、ExitFinish、ExitComplete) は Kernel を実際に動かして生成し、試験 the_tla_exit_table_is_the_kernel が一致を確かめる。I/O の遷移は IoTable を使う。回収の時点と資源の解放を含む状態と遷移の全体は、scripts/ci/tla.sh が TLC の状態グラフと実際の Kernel の動きを突き合わせて、過不足なく一致することを確かめる (crates/kome/src/conform.rs、docs/tla-conformance.md)。"
tested = "終了済みのプロセスが資源を持たないこと、所属関係が相互に一致することが実装で成り立つことは、audit の数え直し、tests の試験、決定的シミュレーションが見る。"
scope = "モデルはスレッド 3 つ、I/O 一つ、参照一つのプロセス一つ。終了は、実行中のスレッドが戻り、応答待ちの I/O が終端するまで回収を待つ。親子関係とジョブは Personality が上に作る。"

