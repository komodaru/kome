[package]
name = "kome-host-std"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "kome の参照ホスト: 実スレッドの worker が、一つの書き手を通して kome を動かす"

[dependencies]
kome = { path = "../kome" }

# 並行の検査 (`RUSTFLAGS="--cfg loom"`) のときだけ、同期の部品を Loom のものに差し替える。
[target.'cfg(loom)'.dependencies]
loom = "0.7.3"

# 並列実行の決定的シミュレーション (`RUSTFLAGS="--cfg shuttle"`) のときだけ、同期の部品を Shuttle のものに
# 差し替える (種から決まる順序で実スレッドの代わりを動かし、同じ種で同じ順序を再現する)。
[target.'cfg(shuttle)'.dependencies]
shuttle = "0.9.10"

[lints]
workspace = true
