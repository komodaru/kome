name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # ref ごとに一つだけ走らせ、待つのは最新の一つだけにする。実行中のものは取り消さない
  # (push が続くと、どの実行も終わらなくなる)。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust
        with:
          key: lint
      - name: kome-lint
        run: cargo run -q --locked -p kome-lint
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 性能の判定が、一つ前のコミットと比べる。
          fetch-depth: 2
      - uses: ./.github/actions/rust
        with:
          key: test
      - name: test (必須の試験が走ったことの照合つき)
        run: scripts/ci/test.sh
      - name: 生成した表が実装と同じ
        run: git diff --exit-code -- tla
      - name: 確保しないと約束した操作が確保しない
        run: cargo test --locked --manifest-path checks/noalloc/Cargo.toml
      - name: 性能の測定の筋書きが動く
        run: cargo bench -p kome-bench --locked -- --smoke
      - name: よく通る操作が、記録と一つ前のコミットより遅くなっていない
        run: scripts/ci/bench-gate.sh

  cover:
    name: cover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust
        with:
          key: cover
          install: rustup toolchain install && rustup component add llvm-tools
      - name: kome の全ての行を、試験か一覧の検証が確かめている
        run: scripts/ci/cover.sh

  no-std:
    name: no_std
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust
        with:
          key: no-std
      - run: rustup target add wasm32v1-none thumbv7em-none-eabi
      - name: Wasm (OS もホストも無い)
        run: cargo build -p kome --locked --target wasm32v1-none
      - name: 32 ビットの組み込み (OS もホストも無い)
        run: cargo build -p kome --locked --target thumbv7em-none-eabi

  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-11-26
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust
        with:
          key: miri
          install: rustup toolchain install nightly-2026-11-26 --profile minimal --component miri
      - name: miri
        run: cargo miri test -p kome --locked --lib

  kani:
    name: kani
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust
        with:
          key: kani
          cache-directories: ~/.kani
      - name: Kani を入れる
        run: |
          if [[ "$(cargo kani --version 2>/dev/null)" != *0.68.0* ]]; then
            cargo install --locked kani-verifier --version 0.68.0
          fi
          cargo kani setup
      - name: kani
        run: scripts/ci/kani.sh

  flux:
    name: flux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.flux
          key: flux-${{ hashFiles('scripts/ci/flux-install.sh') }}
      - name: Flux を入れる
        run: scripts/ci/flux-install.sh
      - name: flux
        run: scripts/ci/flux.sh

  loom:
    name: loom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust
        with:
          key: loom
      - name: loom
        run: scripts/ci/loom.sh

  verus:
    name: verus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.verus
          key: verus-${{ hashFiles('scripts/ci/verus-install.sh') }}
      - name: Verus を入れる
        run: scripts/ci/verus-install.sh
      - name: verus
        run: scripts/ci/verus.sh

  tla:
    name: tla
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tla/tla2tools.jar
          key: tla-tools-v1.7.4
      - uses: ./.github/actions/rust
        with:
          key: tla
      - name: tla
        run: scripts/ci/tla.sh
