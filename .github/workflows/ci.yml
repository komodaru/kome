name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # ref ごとに一つだけ走らせ、待つのは最新の一つだけにする。実行中のものは取り消さない
  # (push が続くと、どの実行も終わらなくなる)。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: lint
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: kome-lint
        run: cargo run -q --locked -p kome-lint
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test (必須の試験が走ったことの照合つき)
        run: scripts/ci/test.sh
      - name: 生成した表が実装と同じ
        run: git diff --exit-code -- tla

  no-std:
    name: no_std
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32v1-none thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: no-std
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Wasm (OS もホストも無い)
        run: cargo build -p kome --locked --target wasm32v1-none
      - name: 32 ビットの組み込み (OS もホストも無い)
        run: cargo build -p kome --locked --target thumbv7em-none-eabi

  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-11-26
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install nightly-2026-11-26 --profile minimal --component miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: miri
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: miri
        run: cargo miri test -p kome --locked --lib

  kani:
    name: kani
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: kani
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-directories: ~/.kani
      - name: Kani を入れる
        run: |
          if ! cargo kani --version 2>/dev/null | grep -q '0\.68\.0'; then
            cargo install --locked kani-verifier --version 0.68.0
          fi
          cargo kani setup
      - name: kani
        run: scripts/ci/kani.sh

  tla:
    name: tla
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tla/tla2tools.jar
          key: tla-tools-${{ hashFiles('scripts/ci/tla.sh') }}
      - name: tla
        run: scripts/ci/tla.sh
